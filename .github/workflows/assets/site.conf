server {
    listen 80;
    server_name cconroy.com www.cconroy.com;

    root /usr/share/nginx/html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        allow all;
    }

    location = /notes/rss.xml {
        return 301 https://$host/feed.xml;
    }

    location ~ ^/tags/(?<tag>[^/]+)/rss\.xml$ {
        return 301 https://$host/tags/$tag/feed.xml;
    }

    location = /notes/notes-on-the-little-typer/ {
        return 301 https://$host/notes/chapter_notes_little_typer/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cconroy.com www.cconroy.com;

    access_log /var/log/nginx/host.access.log main;

    ssl_certificate /etc/letsencrypt/live/cconroy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cconroy.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        allow all;
    }

    location = /notes/rss.xml {
        return 301 /feed.xml;
    }

    location ~ ^/tags/(?<tag>[^/]+)/rss\.xml$ {
        return 301 /tags/$tag/feed.xml;
    }

    location = /notes/notes-on-the-little-typer/ {
        return 301 /notes/chapter_notes_little_typer/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
