<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200" height="200"
  viewBox="-3 -3 6 6">

  <defs>
    <pattern id="minorGrid" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1"
            fill="none" stroke="#d0d0d0" stroke-width="0.03"/>
    </pattern>
  </defs>

  <!-- Grid -->
  <rect x="-3" y="-3" width="6" height="6" fill="url(#minorGrid)"/>

  <!-- Axes -->
  <line x1="-3" y1="0" x2="3" y2="0" stroke="#444" stroke-width="0.03"/>
  <line x1="0" y1="-3" x2="0" y2="3" stroke="#444" stroke-width="0.03"/>

  <polyline
    fill="none"
    stroke="#444"
    stroke-width="0.05"
    stroke-dasharray="0.15 0.15"
    stroke-linecap="round"
    transform="rotate(-90)"
    points="0,0 2,2"/>

  <polyline
    fill="none"
    stroke="#444"
    stroke-width="0.05"
    stroke-linecap="round"
    points="0,0 2,2"/>

  <path
    d="M 1 -1
       A 1.75 1.75 0 0 1 1 1"
    fill="none"
    stroke="#444"
    stroke-width="0.04"
    stroke-linecap="round"/>

  <line x1="1" y1="1" x2="1.3" y2="1" stroke="#444" stroke-width="0.03"/>
  <line x1="1" y1="1" x2="1" y2="0.7" stroke="#444" stroke-width="0.03"/>

  <text
    transform="rotate(-45)"
    x="0.85" y="-0.35"
    font-size="0.35"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
    fill="#444">
    (Fn,Fn)
  </text>

  <text
    x="1.5" y="-0.1"
    font-size="0.35"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial"
    fill="#444">
    *-i
  </text>

  <g fill="lime" stroke="#444" stroke-width="0.06">
    <circle cx="0" cy="0" r="0.15" transform="rotate(-90)"/>
    <circle cx="2" cy="2" r="0.15" transform="rotate(-90)"/>
    <circle cx="2" cy="2" r="0.15"/>
  </g>
</svg>
